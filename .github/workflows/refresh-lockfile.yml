name: Refresh lockfile and validate build

on:
  push:
    branches: [fix/dv-002-auth-provider]
    paths:
      - package.json
      - postcss.config.js
      - .github/workflows/refresh-lockfile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dv-002-auth-provider
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate package lock
        run: npm install --package-lock-only
      - name: Verify clean install
        run: npm ci
      - name: Verify production build
        run: npm run build
      - name: Commit lockfile if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync npm lockfile"
            git push origin HEAD:fix/dv-002-auth-provider
          fi
